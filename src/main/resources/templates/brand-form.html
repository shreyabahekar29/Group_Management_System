
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Brand Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 550px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #263b5e;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .save-btn {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #263b5e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .save-btn:hover {
            background: #1b2d49;
        }

        .cancel-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #263b5e;
            text-decoration: none;
        }

        .error {
            color: #dc3545;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 th:text="${brand.brandId == null} ? 'Add New Brand' : 'Update Brand'">
        Add New Brand
    </h1>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="${brand.brandId == null}
                ? @{/brands}
                : @{/brands/{id}(id=${brand.brandId})}"
          th:object="${brand}"
          method="post">

        <label for="brandName">Brand Name</label>

        <input type="text"
               id="brandName"
               th:field="*{brandName}"
               maxlength="50"
               placeholder="Enter brand name"
               required>

        <label for="chainId">Select Company</label>

        <select id="chainId" name="chainId" required>

            <option value="">-- Select Company --</option>

            <option th:each="chain : ${chains}"
                    th:value="${chain.chainId}"
                    th:text="${chain.companyName}"
                    th:selected="${brand.chain != null and brand.chain.chainId == chain.chainId}">
            </option>

        </select>

        <button type="submit"
                class="save-btn"
                th:text="${brand.brandId == null} ? 'Save Brand' : 'Update Brand'">
            Save Brand
        </button>

    </form>

    <a th:href="@{/brands}" class="cancel-btn">Cancel</a>

</div>

</body>
</html>
