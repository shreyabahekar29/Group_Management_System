
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Zone Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #263238;
        }

        .add-btn {
            display: inline-block;
            background: #1976d2;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #263b5e;
            color: white;
        }

        .edit-btn {
            background: #f0ad4e;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 4px;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            padding: 7px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .success {
            color: green;
            margin-bottom: 15px;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }

        .filter {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Zone Management Dashboard</h1>

    <p class="success" th:if="${successMessage}"
       th:text="${successMessage}"></p>

    <p class="error" th:if="${errorMessage}"
       th:text="${errorMessage}"></p>

    <a th:href="@{/zones/new}" class="add-btn">
        + Add New Zone
    </a>

    <table>
        <thead>
        <tr>
            <th>Zone ID</th>
            <th>Zone Name</th>
            <th>Brand Name</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="zone : ${zones}">
            <td th:text="${zone.zoneId}"></td>

            <td th:text="${zone.zoneName}"></td>

            <td th:text="${zone.brand.brandName}"></td>

            <td>
                <a th:href="@{/zones/{id}/edit(id=${zone.zoneId})}"
                   class="edit-btn">Edit</a>

                <form th:action="@{/zones/{id}/delete(id=${zone.zoneId})}"
                      method="post"
                      style="display:inline;"
                      onsubmit="return confirm('Are you sure you want to delete this zone?');">

                    <button type="submit" class="delete-btn">
                        Delete
                    </button>
                </form>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(zones)}">
            <td colspan="4">No zones available.</td>
        </tr>

        </tbody>
    </table>

</div>

</body>
</html>
